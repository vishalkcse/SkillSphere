# H2 Standalone Fallback Profile Configuration
spring.datasource.url=jdbc:h2:mem:skillspheredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
